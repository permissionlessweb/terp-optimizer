[package]
name = "local-deps-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[package.metadata.optimizer]
standard-build = true
builds = [{ name = "local-deps-contract", features = [] }]

[dependencies]
# Path dependency to simple-contract in parent tests workspace
# Simulates the ibc-rs use case where contracts reference packages via relative paths
simple-contract = { path = "../../simple-contract", features = ["library"] }
cosmwasm-schema = "1.1.3"
cosmwasm-std = "1.1.3"
serde = { version = "1.0.145", default-features = false, features = ["derive"] }

[dev-dependencies]
cw-multi-test = "0.16.2"
